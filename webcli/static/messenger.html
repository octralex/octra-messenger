<!DOCTYPE html>
<html lang="en">
<head>
<script src="/api_access.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>messenger | devnet experiment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,arial,sans-serif;background:#F0F2F5;color:#2B3A52;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;font-size:12px;letter-spacing:0.2px}
.wrap{width:100%;max-width:560px;background:#fff;border:1px solid #D0D7E2}
.head{padding:14px 20px;border-bottom:1px solid #E5E9EF;display:flex;align-items:center;justify-content:space-between}
.head h1{font-size:14px;font-weight:600}
.badge{font-size:11px;color:#8C9DB6;font-family:monospace}
.badge.ok{color:#4CAF50}.badge.bad{color:#E57373}
.notice{padding:10px 20px;background:#F7F8FA;border-bottom:1px solid #E5E9EF;font-size:11px;color:#8C9DB6;line-height:170%}
.row{padding:12px 20px;border-bottom:1px solid #E5E9EF}
.row label{display:block;font-size:11px;color:#8C9DB6;margin-bottom:6px}
.line{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;padding:8px 10px;border:1px solid #D0D7E2;font-family:monospace;font-size:12px;color:#2B3A52;min-width:0}
input:focus{outline:none;border-color:#3B567F}
button{padding:8px 14px;border:1px solid #3B567F;background:#3B567F;color:#fff;font-family:Tahoma,arial,sans-serif;font-size:12px;cursor:pointer;white-space:nowrap}
button:disabled{background:#B0B8C8;border-color:#B0B8C8;cursor:default}
.mono{font-family:monospace;font-size:11px;color:#516E9A;word-break:break-all}
.status{font-size:11px;color:#8C9DB6;margin-top:6px;min-height:14px;line-height:160%}
.status.err{color:#E57373}
.chat{height:340px;overflow-y:auto;padding:14px 20px;background:#FAFBFC;border-bottom:1px solid #E5E9EF;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 10px;border:1px solid #E5E9EF;background:#fff;line-height:150%;white-space:pre-wrap;word-break:break-word}
.msg.out{align-self:flex-end;background:#EEF2F8;border-color:#D0D7E2}
.msg.in{align-self:flex-start}
.msg.bad{color:#E57373;font-size:11px}
.msg.pay{border-color:#3B567F}
.msg.pay b{display:block;font-size:13px;margin:2px 0}
.msg.pay button{margin-top:6px;padding:5px 10px;font-size:11px}
.meta{display:block;font-size:10px;color:#B0B8C8;margin-top:4px;font-family:monospace}
.empty{color:#B0B8C8;text-align:center;margin-top:120px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>messenger</h1><span class="badge" id="wallet">connecting</span></div>
  <div class="notice">Experimental. Messages are end-to-end encrypted and stored on Octra devnet. Sending accounts, timing and message counts are public. Do not use for real conversations.</div>

  <div class="row">
    <label>wallet PIN, kept in this tab only and used to sign your transactions</label>
    <div class="line"><input type="password" id="pin" autocomplete="off" placeholder="PIN"></div>
  </div>

  <div class="row">
    <label>your address — give this to your contact</label>
    <div class="mono" id="address">connecting</div>
  </div>

  <div class="row" id="setup-row">
    <label>your mailbox program (created once, nothing to share)</label>
    <div class="mono" id="mailbox">checking</div>
    <div class="line hidden" id="setup-line" style="margin-top:8px"><button id="setup">create my mailbox</button></div>
    <div class="status" id="setup-status"></div>
  </div>

  <div class="row hidden" id="contact-row">
    <label>contact's address — the one shown as "your address" in their tab</label>
    <div class="line"><input type="text" id="contact" spellcheck="false" placeholder="oct..."><button id="connect">open chat</button></div>
    <div class="status" id="contact-status"></div>
  </div>

  <div class="chat hidden" id="chat"><div class="empty" id="empty">no messages yet</div></div>

  <div class="row hidden" id="send-row">
    <div class="line"><input type="text" id="text" maxlength="600" placeholder="message"><button id="send">send</button></div>
    <div class="status" id="send-status"></div>
    <div class="line" style="margin-top:10px"><input type="text" id="amount" inputmode="decimal" placeholder="OCT amount"><button id="pay">pay privately</button></div>
    <div class="status" id="pay-status">amount is hidden on chain with PVAC encryption · your encrypted balance: <span id="encrypted">…</span></div>
  </div>
</div>
<script src="/messenger.js?v=4"></script>
</body>
</html>
